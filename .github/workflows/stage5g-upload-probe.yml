name: Stage5G upload probe

on:
  push:
    branches:
      - ops/stage5g-r1-acceptance-harness

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit marker only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stage5g-probe
          printf '%s\n' "${GITHUB_RUN_ID}" > .stage5g-probe/ran.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .stage5g-probe/ran.txt
          git commit -m 'probe: confirm branch workflow execution'
          git push origin HEAD:ops/stage5g-r1-acceptance-harness
